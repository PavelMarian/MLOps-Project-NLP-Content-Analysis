apiVersion: apps/v1
kind: Deployment
metadata:
  name: moderation-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moderation-web
  template:
    metadata:
      labels:
        app: moderation-web
    spec:
      containers:
      - name: web
        image: nginxdemos/hello:latest
        ports:
        - containerPort: 80
