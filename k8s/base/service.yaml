---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector: { app: api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-service
spec:
  selector: { app: mlflow }
  ports: [{ port: 5000, targetPort: 5000 }]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]