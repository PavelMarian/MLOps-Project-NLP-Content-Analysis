apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: toxicity-ingress
spec:
  rules:
  - host: api.toxicity.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-service
            port: { number: 8000 }
  - host: mlflow.toxicity.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mlflow-service
            port: { number: 5000 }
  - host: grafana.toxicity.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana-service
            port: { number: 3000 }
  - host: prometheus.toxicity.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-service
            port: { number: 9090 }