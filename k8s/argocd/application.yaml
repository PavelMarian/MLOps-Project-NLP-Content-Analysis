apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: toxicity-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/PavelMarian/MLOps-Project-NLP-Content-Analysis.git
    targetRevision: HEAD
    path: k8s/base/
    kustomize:
      images:
        - toxicity-api=docker.io/yourusername/toxicity-api:latest
  destination:
    server: https://kubernetes.default.svc
    namespace: toxicity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m