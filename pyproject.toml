[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toxicity-moderation"
version = "0.1.0"
description = "Автоматическая модерация токсичных комментариев (бинарная и многоклассовая классификация на RuBERT)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]

dependencies = [
    # Основные ML-библиотеки
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "scikit-learn>=1.3.0",
    
    # Работа с данными
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    
    # API для вызова модели
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    
    # Утилиты
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

multimodal = [
    "torchvision>=0.15.0",
    "pillow>=10.0.0",
]

[project.scripts]
moderate = "moderation.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }