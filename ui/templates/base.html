<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MLOps Content Moderation{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js"></script>
</head>
<body>
    <nav class="navbar">
        <h1>🤖 MLOps Content Moderation</h1>
        <div class="nav-links">
            <a href="/" class="{% if active_page == 'dashboard' %}active{% endif %}">📊 Дашборд</a>
            <a href="/inference" class="{% if active_page == 'inference' %}active{% endif %}">🔮 Инференс</a>
            <a href="/experiments" class="{% if active_page == 'experiments' %}active{% endif %}">📈 Эксперименты</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <div class="toast-container" id="toast-container"></div>

    <div class="footer">
        <p>MLOps Project — Content Moderation System | Мониторинг качества и дрейфа</p>
    </div>
</body>
</html>
