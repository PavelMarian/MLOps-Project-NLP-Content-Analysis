{% extends "base.html" %}

{% block title %}Инференс — MLOps Content Moderation{% endblock %}

{% block content %}
<div class="card">
    <h2>🔮 Проверка текста на токсичность</h2>
    <form id="inference-form">
        <div class="form-group">
            <label for="text">Введите текст для анализа:</label>
            <textarea id="text" name="text" rows="4" placeholder="Введите сообщение для проверки..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary">🔍 Проверить</button>
    </form>
    <div id="result" style="margin-top:1rem; display:none;"></div>
    <div id="feedback-section" style="margin-top:1rem; display:none;">
        <p>Помогите улучшить модель — оцените предсказание:</p>
        <button class="btn btn-secondary" id="feedback-correct" style="margin-right:0.5rem;">✅ Верно</button>
        <button class="btn btn-secondary" id="feedback-incorrect">❌ Неверно</button>
        <div id="feedback-message" style="margin-top:0.5rem; font-weight:bold;"></div>
    </div>
</div>

<script>
let lastPredictionId = null;

document.getElementById('inference-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const text = document.getElementById('text').value;
    const resultDiv = document.getElementById('result');
    const feedbackSection = document.getElementById('feedback-section');
    const feedbackMessage = document.getElementById('feedback-message');
    
    if (!text.trim()) {
        alert('Введите текст');
        return;
    }
    
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '⏳ Анализ...';
    feedbackSection.style.display = 'none';
    feedbackMessage.textContent = '';
    
    try {
        const response = await fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ texts: [text] })
        });
        
        const data = await response.json();
        console.log('Ответ API:', data);
        
        if (data.error) {
            resultDiv.innerHTML = `<div style="color:red;">❌ Ошибка: ${data.error}</div>`;
            return;
        }
        
        if (data.predictions && data.predictions.length > 0) {
            const p = data.predictions[0];
            const isToxic = p.label === 'toxic';
            lastPredictionId = p.id;  // сохраняем ID для фидбека
            
            resultDiv.innerHTML = `
                <div style="padding:1rem;border-radius:8px;background:${isToxic ? '#fdd' : '#dfd'};">
                    <strong>Результат:</strong> ${isToxic ? '🚫 Токсично' : '✅ Безопасно'}<br>
                    <strong>Уверенность:</strong> ${(p.confidence * 100).toFixed(1)}%<br>
                    <strong>Вероятность:</strong> ${(p.toxic_prob * 100).toFixed(1)}%
                </div>
            `;
            
            // Показываем секцию фидбека, активируем кнопки
            feedbackSection.style.display = 'block';
            document.getElementById('feedback-correct').disabled = false;
            document.getElementById('feedback-incorrect').disabled = false;
            feedbackMessage.textContent = '';
        } else {
            resultDiv.innerHTML = '<div style="color:orange;">⚠️ Нет предсказаний</div>';
        }
    } catch (error) {
        console.error('Ошибка:', error);
        resultDiv.innerHTML = '<div style="color:red;">❌ Ошибка при анализе</div>';
    }
});

// Обработчики для кнопок фидбека
document.getElementById('feedback-correct').addEventListener('click', function() {
    sendFeedback(true);
});

document.getElementById('feedback-incorrect').addEventListener('click', function() {
    sendFeedback(false);
});

async function sendFeedback(isCorrect) {
    if (lastPredictionId === null) {
        alert('Нет предсказания для оценки');
        return;
    }
    
    const feedbackMessage = document.getElementById('feedback-message');
    const btnCorrect = document.getElementById('feedback-correct');
    const btnIncorrect = document.getElementById('feedback-incorrect');
    
    // Блокируем кнопки, чтобы не отправлять повторно
    btnCorrect.disabled = true;
    btnIncorrect.disabled = true;
    feedbackMessage.textContent = '⏳ Отправка...';
    feedbackMessage.style.color = '#666';
    
    try {
        const response = await fetch('/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                prediction_id: lastPredictionId,
                is_correct: isCorrect
            })
        });
        
        const data = await response.json();
        if (response.ok) {
            feedbackMessage.textContent = '✅ Спасибо за обратную связь!';
            feedbackMessage.style.color = '#28a745';
            // Опционально: скрыть кнопки через пару секунд
            setTimeout(() => {
                document.getElementById('feedback-section').style.display = 'none';
            }, 3000);
        } else {
            feedbackMessage.textContent = '❌ Ошибка: ' + (data.detail || 'неизвестная ошибка');
            feedbackMessage.style.color = '#dc3545';
            // Разблокируем кнопки при ошибке
            btnCorrect.disabled = false;
            btnIncorrect.disabled = false;
        }
    } catch (error) {
        console.error('Ошибка при отправке фидбека:', error);
        feedbackMessage.textContent = '❌ Ошибка при отправке';
        feedbackMessage.style.color = '#dc3545';
        btnCorrect.disabled = false;
        btnIncorrect.disabled = false;
    }
}
</script>
{% endblock %}
